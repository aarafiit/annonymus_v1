spring.application.name=annonymus_v1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/desi_kola}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# run data.sql (institute seed) after Hibernate has created/updated the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# Timestamps
#
# Rows are stamped in Bangladesh Standard Time (UTC+6) because that is the clock
# every reader of this record keeps. See com.example.annonymus_v1.util.AppTime.
# ---------------------------------------------------------------------------
spring.jackson.time-zone=Asia/Dhaka

# ---------------------------------------------------------------------------
# Moderation
#
# Removing a review requires this secret in an X-Admin-Token header. It is empty
# by default, which leaves the delete endpoint accepting nothing: an open delete
# route on an anonymous site means any visitor can erase anybody's entry.
# ---------------------------------------------------------------------------
app.admin.delete-token=${APP_ADMIN_DELETE_TOKEN:}

# ---------------------------------------------------------------------------
# Rate limiting
#
# Budgets live here rather than in code so they can be tightened during an
# incident by restarting with new environment variables, without a rebuild.
# Rules are evaluated in order and the first match wins, so the specific write
# paths are declared before the catch-all read budget.
# ---------------------------------------------------------------------------
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}

# Addresses or CIDR blocks of proxies allowed to set X-Forwarded-For. Empty means
# forwarded headers are ignored entirely and the socket address is used, which is
# the safe default: honouring the header from an untrusted caller lets an attacker
# forge a new identity per request and bypass every limit below.
app.rate-limit.trusted-proxies=${APP_RATE_LIMIT_TRUSTED_PROXIES:}

# Posting a review writes an unbounded row to disk, so this is the tightest budget.
app.rate-limit.rules[0].name=review-create
app.rate-limit.rules[0].methods=POST
app.rate-limit.rules[0].patterns=/reviews
app.rate-limit.rules[0].capacity=5
app.rate-limit.rules[0].refill-tokens=5
app.rate-limit.rules[0].refill-period=1m

# Voting is cheap and legitimately bursty while a reader works through a feed.
app.rate-limit.rules[1].name=vote
app.rate-limit.rules[1].methods=POST
app.rate-limit.rules[1].patterns=/reviews/*/like,/reviews/*/dislike
app.rate-limit.rules[1].capacity=30
app.rate-limit.rules[1].refill-tokens=30
app.rate-limit.rules[1].refill-period=1m

app.rate-limit.rules[2].name=comment-create
app.rate-limit.rules[2].methods=POST
app.rate-limit.rules[2].patterns=/reviews/*/comment
app.rate-limit.rules[2].capacity=10
app.rate-limit.rules[2].refill-tokens=10
app.rate-limit.rules[2].refill-period=1m

# Operator-only now, but still budgeted so a leaked token cannot be used to
# mass-delete, and so token guessing costs more than it earns.
app.rate-limit.rules[3].name=review-delete
app.rate-limit.rules[3].methods=DELETE
app.rate-limit.rules[3].patterns=/reviews/*
app.rate-limit.rules[3].capacity=5
app.rate-limit.rules[3].refill-tokens=5
app.rate-limit.rules[3].refill-period=1m

# The most expensive endpoint in the application: a full aggregate over reviews
# with no cache. A small request buys a large amount of database work, which makes
# it the cheapest thing to attack and the most important thing to cap.
app.rate-limit.rules[4].name=analytics
app.rate-limit.rules[4].methods=GET
app.rate-limit.rules[4].patterns=/analytics
app.rate-limit.rules[4].capacity=20
app.rate-limit.rules[4].refill-tokens=20
app.rate-limit.rules[4].refill-period=1m

# Everything else, chiefly reads. Generous enough that normal browsing never
# notices, low enough that a single host cannot saturate the connection pool.
app.rate-limit.fallback.name=default
app.rate-limit.fallback.capacity=120
app.rate-limit.fallback.refill-tokens=120
app.rate-limit.fallback.refill-period=1m
