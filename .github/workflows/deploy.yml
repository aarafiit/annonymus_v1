name: CI/CD with Docker Hub

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/springboot-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/springboot-app:latest .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/springboot-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/springboot-app:latest

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on Azure VM via Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} \
            "cd ~/deploy && \
             sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=${{ github.sha }}/' .env && \
             docker compose pull backend && \
             docker compose up -d backend && \
             docker image prune -f"